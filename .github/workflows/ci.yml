name: CI

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run integrity checks
        run: ./scripts/test.sh

  build-artifact:
    needs: integrity
    uses: ./.github/workflows/web-build-reusable.yml
